        .controls { margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; width: 350px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .usage-note { font-size: 12px; color: #666; margin-top: 10px; margin-bottom: 0; }
        #chord-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .chord-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); min-width: 160px; border: 2px solid transparent; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
        .chord-card:hover { transform: scale(1.02); border-color: #007bff; }
        .chord-name { margin: 0 0 5px 0; font-size: 1.4em; color: #007bff; font-weight: bold; }
        .chord-tip { font-size: 11px; color: #888; margin: 0 0 10px 0; }
    </style>
</head>

        CHORD_DB["Bbaug"] = CHORD_DB["A#aug"];

        // 状態管理オブジェクト
        let voicingState = {};

        // SVGで指板を描画する関数
        function createChordSVG(frets, baseFret) {
            const width = 140;
            const height = 150;
            const startX = 30;
            const startY = 25;
            const stringGap = 16;
            const fretGap = 22;

            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
            
            if (baseFret > 1) {
                svg += `<text x="8" y="${startY + fretGap - 4}" font-size="11" fill="#666" font-weight="bold">${baseFret}fr</text>`;
            }

            // ナットまたはフレットの描画
            if (baseFret === 1) {
                svg += `<line x1="${startX}" y1="${startY}" x2="${startX + stringGap * 5}" y2="${startY}" stroke="#333" stroke-width="4"/>`;
            } else {
                svg += `<line x1="${startX}" y1="${startY}" x2="${startX + stringGap * 5}" y2="${startY}" stroke="#333" stroke-width="2"/>`;
            }

            // フレット（横線）
            for (let i = 1; i <= 5; i++) {
                svg += `<line x1="${startX}" y1="${startY + fretGap * i}" x2="${startX + stringGap * 5}" y2="${startY + fretGap * i}" stroke="#aaa" stroke-width="1"/>`;
            }

            // 弦（縦線）
            for (let i = 0; i < 6; i++) {
                svg += `<line x1="${startX + stringGap * i}" y1="${startY}" x2="${startX + stringGap * i}" y2="${startY + fretGap * 5}" stroke="#777" stroke-width="1"/>`;
            }

            // 各弦のフレット位置を描画
            frets.forEach((fret, stringIdx) => {
                const x = startX + stringGap * stringIdx;
                if (fret === null) {
                    // ミュート (×)
                    svg += `<text x="${x}" y="${startY - 8}" font-size="10" font-weight="bold" fill="#e74c3c" text-anchor="middle">×</text>`;
                } else if (fret === 0) {
                    // オープン (○)
                    svg += `<circle cx="${x}" cy="${startY - 8}" r="3" fill="none" stroke="#2ecc71" stroke-width="1.5"/>`;
                } else {
                    // 押さえるフレット
                    const relativeFret = fret - baseFret + 1;
                    if (relativeFret >= 1 && relativeFret <= 5) {
                        const y = startY + fretGap * (relativeFret - 0.5);
                        svg += `<circle cx="${x}" cy="${y}" r="6" fill="#007bff"/>`;
                        svg += `<text x="${x}" y="${y + 3.5}" font-size="9" fill="white" font-weight="bold" text-anchor="middle">${fret}</text>`;
                    }
                }
            });

            svg += `</svg>`;
            return svg;
        }

        function updateChords() {
            const inputVal = document.getElementById('progression').value;
            const chords = inputVal.trim().split(/\s+/);
            const container = document.getElementById('chord-container');
            container.innerHTML = '';

            chords.forEach((chordName, index) => {
                if (!chordName) return;
                const voicings = CHORD_DB[chordName];

                if (!voicings) {
                    const card = document.createElement('div');
                    card.className = 'chord-card';
                    card.innerHTML = `<h3 class="chord-name">${chordName}</h3><p class="chord-tip">未登録</p>`;
                    container.appendChild(card);
                    return;
                }

                if (voicingState[index] === undefined) {
                    voicingState[index] = 0;
                }
                const vIndex = voicingState[index] % voicings.length;
                const currentFrets = voicings[vIndex];

                // 基準フレットの計算
                let activeFrets = currentFrets.filter(f => f !== null && f > 0);
                let minFret = activeFrets.length > 0 ? Math.min(...activeFrets) : 1;
                let baseFret = minFret > 4 ? minFret : 1;

                const card = document.createElement('div');
                card.className = 'chord-card';
                card.innerHTML = `
                    <h3 class="chord-name">${chordName}</h3>
                    <p class="chord-tip">押さえ方: ${vIndex + 1}/${voicings.length}</p>
                    ${createChordSVG(currentFrets, baseFret)}
                `;

                card.onclick = () => {
                    voicingState[index] = (voicingState[index] + 1) % voicings.length;
                    updateChords();
                };

                container.appendChild(card);
            });
        }

        // 初期表示
        window.onload = () => {
            updateChords();
        };
    </script>
