<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ギターコード検索ちゃん🎸</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .controls { margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; width: 350px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .usage-note { font-size: 12px; color: #666; margin-top: 10px; margin-bottom: 0; }
        #chord-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .chord-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); min-width: 160px; border: 2px solid transparent; }
        .chord-name { margin: 0 0 10px 0; font-size: 1.4em; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>ギターコード検索ちゃん🎸</h1>
    <div class="controls">
        <input type="text" id="progression" placeholder="例: C G/B Am7 Dsus4 Cadd9" value="C G/B Am7 Dsus4 Cadd9">
        <button onclick="updateChords()">表示</button>
        <p class="usage-note">＊外部通信を一切しないため、どんな環境でも確実に動作します！</p>
    </div>

    <div id="chord-container"></div>

    <script>
        // よく使うギターコードのフレットデータ（6弦〜1弦。null=x, 0=開放, 1以上=フレット）
        const CHORD_DB = {
            "C": [null, 3, 2, 0, 1, 0],
            "Cm": [null, 3, 5, 5, 4, 3],
            "C7": [null, 3, 2, 3, 1, 0],
            "Cmaj7": [null, 3, 2, 0, 0, 0],
            "Csus4": [null, 3, 3, 0, 1, 1],
            "Cadd9": [null, 3, 2, 0, 3, 0],
            
            "G": [3, 2, 0, 0, 0, 3],
            "Gm": [3, 5, 5, 3, 3, 3],
            "G7": [3, 2, 0, 0, 0, 1],
            "Gsus4": [3, 3, 0, 0, 3, 3],
            "G/B": [null, 2, 0, 0, 3, 3],
            
            "A": [null, 0, 2, 2, 2, 0],
            "Am": [null, 0, 2, 2, 1, 0],
            "A7": [null, 0, 2, 0, 2, 0],
            "Amaj7": [null, 0, 2, 1, 2, 0],
            "Asus4": [null, 0, 2, 2, 3, 0],
            "Aadd9": [null, 0, 2, 4, 2, 0],
            
            "D": [null, null, 0, 2, 3, 2],
            "Dm": [null, null, 0, 2, 3, 1],
            "D7": [null, null, 0, 2, 1, 2],
            "Dmaj7": [null, null, 0, 2, 2, 2],
            "Dsus4": [null, null, 0, 2, 3, 3],
            "D/F#": [2, null, 0, 2, 3, 2],
            
            "E": [0, 2, 2, 1, 0, 0],
            "Em": [0, 2, 2, 0, 0, 0],
            "E7": [0, 2, 0, 1, 0, 0],
            "Emaj7": [0, 2, 1, 1, 0, 0],
            "Esus4": [0, 2, 2, 2, 0, 0],
            
            "F": [1, 3, 3, 2, 1, 1],
            "Fm": [1, 3, 3, 1, 1, 1],
            "F7": [1, 3, 1, 2, 1, 1],
            "Fmaj7": [null, null, 3, 2, 1, 0],
            "Fsus4": [1, 3, 3, 3, 1, 1],
            "F/A": [null, 0, 3, 2, 1, 1],
            
            "B": [null, 2, 4, 4, 4, 2],
            "Bm": [null, 2, 4, 4, 3, 2],
            "B7": [null, 2, 1, 2, 0, 2],
            "Bmaj7": [null, 2, 4, 3, 4, 2],
            "Bsus4": [null, 2, 4, 4, 5, 2]
        };

        // SVGで指板をきれいに描画する関数
        function createChordSVG(frets) {
            const width = 140;
            const height = 150;
            const startX = 25;
            const startY = 25;
            const stringGap = 18;
            const fretGap = 22;

            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
            
            // 縦線（6本の弦）
            for (let i = 0; i < 6; i++) {
                let x = startX + i * stringGap;
                svg += `<line x1="${x}" y1="${startY}" x2="${x}" y2="${startY + 4 * fretGap}" stroke="#333" stroke-width="2"/>`;
            }

            // 横線（5本のフレット）
            for (let i = 0; i < 5; i++) {
                let y = startY + i * fretGap;
                let strokeW = (i === 0) ? 5 : 2; // ナット（一番上の太い線）
                svg += `<line x1="${startX}" y1="${y}" x2="${startX + 5 * stringGap}" y2="${y}" stroke="#333" stroke-width="${strokeW}"/>`;
            }

            // 各弦のマーク（×, ○, 押さえている点）
            frets.forEach((fret, i) => {
                let x = startX + i * stringGap;
                
                if (fret === null) {
                    // ミュート (×)
                    svg += `<text x="${x - 4}" y="${startY - 8}" font-size="12" fill="#d9534f" font-weight="bold">×</text>`;
                } else if (fret === 0) {
                    // 開放弦 (○)
                    svg += `<circle cx="${x}" cy="${startY - 8}" r="4" fill="none" stroke="#28a745" stroke-width="2"/>`;
                } else {
                    // 押さえる位置（黒丸）
                    let y = startY + (fret - 1) * fretGap + fretGap / 2;
                    svg += `<circle cx="${x}" cy="${y}" r="6" fill="#007bff"/>`;
                }
            });

            svg += `</svg>`;
            return svg;
        }

        function updateChords() {
            const input = document.getElementById('progression').value;
            const container = document.getElementById('chord-container');
            container.innerHTML = '';

            const chords = input.trim().split(/[\s,]+/);
            chords.forEach(name => {
                if (!name) return;

                const card = document.createElement('div');
                card.className = 'chord-card';
                card.innerHTML = `<p class="chord-name">${name}</p>`;

                let frets = CHORD_DB[name];
                if (!frets) {
                    card.innerHTML += `<p style="font-size:12px; color:#e0a800; margin:20px 0;">(未登録)</p>`;
                } else {
                    card.innerHTML += createChordSVG(frets);
                }

                container.appendChild(card);
            });
        }

        window.onload = updateChords;
    </script>
</body>
</html>
